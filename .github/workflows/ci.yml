name: CI
on:
    push:
        branches:
            - master
    pull_request:
jobs:
    build:
        name: Assemble
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: gradle/wrapper-validation-action@b5418f5a58f5fd2eb486dd7efb368fe7be7eae45 # v2
            - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
              with:
                distribution: 'zulu'
                java-version: '17'
            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
            - name: Assemble
              run: ./gradlew assemble
              working-directory: .
    detekt:
        name: Detekt
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: gradle/wrapper-validation-action@b5418f5a58f5fd2eb486dd7efb368fe7be7eae45 # v2
            - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
              with:
                distribution: 'zulu'
                java-version: '17'
            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
            - name: Detekt
              run: ./gradlew detekt --stacktrace
              working-directory: .
            - name: Upload failure reports
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                path: '**/build/reports'

    unit-tests:
        name: Unit tests
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: gradle/wrapper-validation-action@b5418f5a58f5fd2eb486dd7efb368fe7be7eae45 # v2
            - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
              with:
                distribution: 'zulu'
                java-version: '17'
            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
            - name: Unit tests
              run: ./gradlew testDebugUnitTest
              working-directory: .
            - name: Upload failure reports
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                name: unit-test-reports
                path: '**/build/reports'

    instrumentation-tests:
        name: Instrumentation tests
        runs-on: macos-13
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
              with:
                distribution: 'zulu'
                java-version: '17'
            - uses: gradle/wrapper-validation-action@56b90f209b02bf6d1deae490e9ef18b21a389cd4 # v1
            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
            - name: Pre build sources before launching emulator
              run: ./gradlew compileDebugAndroidTestSources
            - name: AVD cache
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              id: avd-cache
              with:
                path: |
                  ~/.android/avd/*
                  ~/.android/adb*
                key: avd-29-ribs
            - name: Create AVD and generate snapshot for caching
              if: steps.avd-cache.outputs.cache-hit != 'true'
              uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
              with:
                  # Use API 29 https://github.com/ReactiveCircus/android-emulator-runner/issues/222
                  api-level: 29
                  arch: x86_64
                  force-avd-creation: false
                  emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                  disable-animations: false
                  script: echo "Generated AVD snapshot for caching."
            - name: Instrumentation tests
              uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
              with:
                  # Use API 29 https://github.com/ReactiveCircus/android-emulator-runner/issues/222
                  api-level: 29
                  arch: x86_64
                  force-avd-creation: false
                  emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                  disable-animations: true
                  script: |
                    adb logcat > logcat.out &
                    ./gradlew connectedCheck
            - name: Upload failed instrumentation artifacts
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                name: instrumentation-failures
                path: |
                  **/build/reports
                  logcat.out
    verify-publication:
      name: Verify publication
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
        - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        - uses: gradle/wrapper-validation-action@b5418f5a58f5fd2eb486dd7efb368fe7be7eae45 # v2
        - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
          with:
            distribution: 'zulu'
            java-version: '17'
        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        - name: Verify
          run: ./gradlew publishToMavenLocal
          working-directory: .
